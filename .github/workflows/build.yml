# Builds an installable JoyoFit APK on GitHub's servers.
# If joyofit-navigasi-musik.patch is in the repo root, it is applied first.
# Download the APK from the run's page under "Artifacts".
name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [master, main]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Apply patch
        run: |
          if [ -f joyofit-navigasi-musik.patch ]; then
            git apply --verbose joyofit-navigasi-musik.patch
          else
            echo "No patch file found, building the original app"
          fi

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Android SDK 36
        run: sdkmanager "platforms;android-36"

      - name: Install dependencies
        run: bun install

      - name: Generate the Android project
        run: bunx expo prebuild -p android --no-install
        env:
          JOYOFIT_DISTRIBUTION: sideload

      - name: Build the APK
        working-directory: android
        env:
          JOYOFIT_DISTRIBUTION: sideload
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: joyofit-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
